<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- =====================================================
         PSD PREVIEW SIZE FIX
    ====================================================== -->

    <style>

        /* =================================================
           PSD RESULT CONTAINER
        ================================================= */

        .psd-result {
            width: min(900px, calc(100% - 32px));
            max-width: 900px;

            margin: 20px auto;

            padding: 16px;

            box-sizing: border-box;

            border-radius: 16px;

            background: rgba(12, 15, 35, 0.96);

            border: 1px solid rgba(130, 90, 255, 0.35);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35);

            overflow: hidden;
        }


        /* =================================================
           PSD HEADER
        ================================================= */

        .psd-result-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 12px;

        }


        .psd-result-header > div {

            display: flex;

            flex-direction: column;

            gap: 3px;

            min-width: 0;

        }


        .psd-result-header strong {

            font-size: 16px;

            color: #ffffff;

        }


        .psd-result-header span {

            font-size: 12px;

            color: rgba(255, 255, 255, 0.55);

        }


        /* =================================================
           CLOSE BUTTON
        ================================================= */

        .psd-close-btn {

            width: 32px;

            height: 32px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 0;

            border-radius: 9px;

            background: rgba(255, 255, 255, 0.08);

            color: #ffffff;

            font-size: 20px;

            cursor: pointer;

        }


        .psd-close-btn:hover {

            background: rgba(255, 255, 255, 0.16);

        }


        /* =================================================
           STATUS
        ================================================= */

        .psd-status {

            width: 100%;

            box-sizing: border-box;

            padding: 9px 12px;

            margin-bottom: 12px;

            border-radius: 8px;

            background: rgba(255, 255, 255, 0.06);

            color: rgba(255, 255, 255, 0.72);

            font-size: 12px;

        }


        /* =================================================
           PREVIEW WRAPPER
        ================================================= */

        .psd-preview-wrapper {

            width: 100%;

            height: 480px;

            max-height: 480px;

            overflow: hidden;

            position: relative;

            border-radius: 12px;

            background: #ffffff;

            border: 1px solid rgba(255, 255, 255, 0.12);

        }


        /* =================================================
           PREVIEW IFRAME
        ================================================= */

        .psd-preview {

            display: block;

            width: 100%;

            height: 100%;

            min-height: 0;

            border: 0;

            background: #ffffff;

        }


        /* =================================================
           ACTIONS
        ================================================= */

        .psd-actions {

            display: flex;

            justify-content: flex-end;

            margin-top: 12px;

        }


        .psd-download-btn {

            border: 0;

            border-radius: 9px;

            padding: 10px 16px;

            background: linear-gradient(
                135deg,
                #6d4aff,
                #8d5cff
            );

            color: #ffffff;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

        }


        .psd-download-btn:hover {

            transform: translateY(-1px);

        }


        /* =================================================
           CHAT AREA
        ================================================= */

        .chat-area {

            overflow-y: auto;

            overflow-x: hidden;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 768px) {

            .psd-result {

                width: calc(100% - 20px);

                margin: 12px auto;

                padding: 12px;

                border-radius: 13px;

            }


            .psd-preview-wrapper {

                height: 380px;

                max-height: 380px;

            }


            .psd-result-header strong {

                font-size: 14px;

            }


            .psd-result-header span {

                font-size: 11px;

            }


            .psd-download-btn {

                width: 100%;

            }


            .psd-actions {

                display: block;

            }

        }


        /* =================================================
           SMALL MOBILE
        ================================================= */

        @media (max-width: 480px) {

            .psd-preview-wrapper {

                height: 320px;

                max-height: 320px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     PREMIUM CURSOR
===================================================== -->

<div class="ai-cursor">

    <div class="cursor-core"></div>

    <div class="cursor-ring"></div>

    <div class="cursor-glow"></div>

</div>


<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>


<!-- =====================================================
     APP
===================================================== -->

<div class="app">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-top">


            <!-- LOGO -->

            <div class="brand">

                <div class="brand-logo">

                    <span>✦</span>

                </div>

                <div class="brand-name">

                    Mini <span>AI</span>

                </div>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat-btn"
                id="newChatBtn"
                type="button"
            >

                <span class="plus-icon">
                    +
                </span>

                <span>
                    New Chat
                </span>

            </button>


            <!-- TODAY -->

            <div class="sidebar-section">

                <div class="section-title">
                    TODAY
                </div>


                <button
                    class="conversation active"
                    type="button"
                    id="currentConversation"
                >

                    <span class="conversation-icon">
                        ◇
                    </span>

                    <span>
                        New conversation
                    </span>

                </button>

            </div>


            <!-- RECENT -->

            <div
                class="sidebar-section recent-section"
            >

                <div class="section-title">
                    RECENT
                </div>

                <div id="recentChats"></div>

            </div>

        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button
                class="sidebar-bottom-btn"
                id="settingsBtn"
                type="button"
            >

                <span>
                    ⚙
                </span>

                <span>
                    Settings
                </span>

                <span class="arrow">
                    ›
                </span>

            </button>

        </div>

    </aside>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="mobile-menu-btn"
                    id="mobileMenuBtn"
                    type="button"
                >

                    ☰

                </button>

            </div>


            <div class="topbar-actions">

                <div class="ai-orb-small">

                    <div class="ai-logo">

                        <div class="ai-orbit orbit-1"></div>

                        <div class="ai-orbit orbit-2"></div>

                        <div class="ai-orbit orbit-3"></div>

                        <div class="ai-glow"></div>

                        <div class="ai-core">

                            <span>
                                AI
                            </span>

                        </div>

                        <div class="ai-particle p1"></div>

                        <div class="ai-particle p2"></div>

                        <div class="ai-particle p3"></div>

                        <div class="ai-particle p4"></div>

                    </div>

                </div>

            </div>

        </header>


        <!-- =================================================
             CHAT AREA
        ================================================== -->

        <section class="chat-area">


            <!-- =================================================
                 WELCOME SCREEN
            ================================================== -->

            <div
                class="welcome-screen"
                id="welcomeScreen"
            >


                <!-- MANI AI LOGO -->

                <div class="mani-ai-logo">

                    <div class="mani-ai-ring ring-one"></div>

                    <div class="mani-ai-ring ring-two"></div>

                    <div class="mani-ai-text">

                        <span class="mani-main">
                            MANI
                        </span>

                        <span class="mani-ai">
                            AI
                        </span>

                    </div>

                    <div class="mani-ai-line"></div>

                    <div class="mani-particle particle-one"></div>

                    <div class="mani-particle particle-two"></div>

                    <div class="mani-particle particle-three"></div>

                    <div class="mani-particle particle-four"></div>

                </div>


                <!-- =================================================
                     QUICK CARDS
                ================================================== -->

                <div class="quick-cards">


                    <button
                        class="quick-card"
                        data-prompt="Give me some creative ideas for my next project"
                        type="button"
                    >

                        <div class="card-icon idea">
                            ♧
                        </div>

                        <strong>
                            Get Ideas
                        </strong>

                        <span>
                            Brainstorm anything
                        </span>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="Help me write professional content"
                        type="button"
                    >

                        <div class="card-icon write">
                            ◈
                        </div>

                        <strong>
                            Write Content
                        </strong>

                        <span>
                            Blogs, emails, scripts
                        </span>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="Help me debug and solve this coding problem"
                        type="button"
                    >

                        <div class="card-icon code">
                            &lt;/&gt;
                        </div>

                        <strong>
                            Code Help
                        </strong>

                        <span>
                            Debug, explain, solve
                        </span>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="Analyze this data and give me useful insights"
                        type="button"
                    >

                        <div class="card-icon data">
                            ▥
                        </div>

                        <strong>
                            Analyze Data
                        </strong>

                        <span>
                            Charts, insights, trends
                        </span>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="Help me create a modern UI design"
                        type="button"
                    >

                        <div class="card-icon design">
                            ✿
                        </div>

                        <strong>
                            Design & UI
                        </strong>

                        <span>
                            Layouts, UI ideas
                        </span>

                    </button>

                </div>

            </div>


            <!-- =================================================
                 CHAT MESSAGES
            ================================================== -->

            <div
                class="chat-messages"
                id="chatMessages"
            ></div>


            <!-- =================================================
                 PSD TO HTML RESULT
            ================================================== -->

            <div
                class="psd-result"
                id="psdResult"
                hidden
            >

                <!-- HEADER -->

                <div class="psd-result-header">

                    <div>

                        <strong>
                            PSD To HTML
                        </strong>

                        <span>
                            Generated website preview
                        </span>

                    </div>


                    <button
                        type="button"
                        id="closePsdPreview"
                        class="psd-close-btn"
                        title="Close preview"
                    >
                        ×
                    </button>

                </div>


                <!-- STATUS -->

                <div
                    class="psd-status"
                    id="psdStatus"
                >
                    Ready
                </div>


                <!-- PREVIEW -->

                <div class="psd-preview-wrapper">

                    <iframe
                        id="psdPreview"
                        class="psd-preview"
                        title="PSD HTML Preview"
                        loading="lazy"
                    ></iframe>

                </div>


                <!-- DOWNLOAD -->

                <div class="psd-actions">

                    <button
                        type="button"
                        id="downloadHtmlBtn"
                        class="psd-download-btn"
                    >
                        ↓ Download HTML
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer-area">


            <!-- ATTACHMENT PREVIEW -->

            <div
                class="attachment-preview"
                id="attachmentPreview"
            ></div>


            <!-- COMPOSER -->

            <div
                class="composer"
                id="composer"
            >


                <!-- INPUT -->

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="Message Mini AI..."
                    autocomplete="off"
                ></textarea>


                <!-- EXPAND -->

                <button
                    type="button"
                    class="composer-expand"
                    id="composerExpand"
                    title="Expand"
                >
                    +
                </button>


                <!-- TOOLBAR -->

                <div class="composer-toolbar">


                    <div class="composer-left">


                        <!-- PLUS -->

                        <button
                            type="button"
                            class="tool-btn"
                            id="plusBtn"
                            title="Tools"
                        >
                            +
                        </button>


                        <!-- WEB -->

                        <button
                            type="button"
                            class="tool-btn"
                            id="webBtn"
                            title="Web search"
                        >

                            <span class="globe"></span>

                        </button>


                        <!-- ATTACH -->

                        <button
                            type="button"
                            class="tool-btn"
                            id="attachBtn"
                            title="Attach images"
                        >

                            <span class="paperclip">
                                ⌕
                            </span>

                        </button>


                        <!-- FILE INPUT -->

                        <input
                            type="file"
                            id="fileInput"
                            hidden
                            multiple
                            accept="image/*"
                        >


                        <!-- MAGIC -->

                        <button
                            type="button"
                            class="tool-btn magic-btn"
                            id="magicBtn"
                            title="AI tools"
                        >
                            ✣
                        </button>

                    </div>


                    <div class="composer-right">


                        <!-- MIC -->

                        <button
                            type="button"
                            class="tool-btn mic-btn"
                            id="micBtn"
                            title="Voice input"
                        >
                            ♫
                        </button>


                        <!-- SEND -->

                        <button
                            type="button"
                            class="send-btn"
                            id="sendBtn"
                            title="Send"
                        >
                            ↑
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     TOOLS POPUP
                ================================================== -->

                <div
                    class="tools-popup"
                    id="toolsPopup"
                >


                    <button
                        type="button"
                        class="tool-option"
                        data-action="image"
                    >

                        <span>
                            ✦
                        </span>

                        <div>

                            <strong>
                                Generate Image
                            </strong>

                            <small>
                                Create an image with AI
                            </small>

                        </div>

                    </button>


                    <button
                        type="button"
                        class="tool-option"
                        data-action="code"
                    >

                        <span>
                            &lt;/&gt;
                        </span>

                        <div>

                            <strong>
                                Code
                            </strong>

                            <small>
                                Write or debug code
                            </small>

                        </div>

                    </button>


                    <button
                        type="button"
                        class="tool-option"
                        data-action="summarize"
                    >

                        <span>
                            ≡
                        </span>

                        <div>

                            <strong>
                                Summarize
                            </strong>

                            <small>
                                Summarize text
                            </small>

                        </div>

                    </button>

                </div>

            </div>


            <!-- DISCLAIMER -->

            <div class="composer-disclaimer">

                Mini AI can make mistakes.
                Check important information.

            </div>

        </div>

    </main>

</div>


<!-- =====================================================
     MOBILE OVERLAY
===================================================== -->

<div
    class="mobile-overlay"
    id="mobileOverlay"
></div>


<!-- =====================================================
     MAIN SCRIPT
===================================================== -->

<script src="script.js"></script>


<!-- =====================================================
     PSD PREVIEW CONTROL
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const psdResult =
            document.getElementById(
                "psdResult"
            );

        const closePsdPreview =
            document.getElementById(
                "closePsdPreview"
            );

        const psdPreview =
            document.getElementById(
                "psdPreview"
            );

        const downloadHtmlBtn =
            document.getElementById(
                "downloadHtmlBtn"
            );


        /* =================================================
           CLOSE PREVIEW
        ================================================= */

        if (closePsdPreview) {

            closePsdPreview.addEventListener(
                "click",
                () => {

                    psdResult.hidden = true;

                    psdPreview.src = "";

                }
            );

        }


        /* =================================================
           DOWNLOAD HTML
        ================================================= */

        if (downloadHtmlBtn) {

            downloadHtmlBtn.addEventListener(
                "click",
                () => {

                    try {

                        const html =
                            psdPreview
                                .contentDocument
                                ?.documentElement
                                ?.outerHTML;


                        if (!html) {

                            alert(
                                "HTML preview is not ready yet."
                            );

                            return;

                        }


                        const completeHTML =
                            "<!DOCTYPE html>\n" +
                            html;


                        const blob =
                            new Blob(
                                [
                                    completeHTML
                                ],
                                {
                                    type:
                                        "text/html"
                                }
                            );


                        const url =
                            URL.createObjectURL(
                                blob
                            );


                        const link =
                            document.createElement(
                                "a"
                            );


                        link.href = url;

                        link.download =
                            "generated-website.html";


                        document.body.appendChild(
                            link
                        );


                        link.click();


                        link.remove();


                        setTimeout(
                            () => {

                                URL.revokeObjectURL(
                                    url
                                );

                            },
                            1000
                        );


                    } catch (error) {

                        console.error(
                            "Download error:",
                            error
                        );


                        alert(
                            "Unable to download the generated HTML."
                        );

                    }

                }
            );

        }

    }
);

</script>


</body>

</html>
