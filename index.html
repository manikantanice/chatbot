<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<!-- =====================================================
     PREMIUM CURSOR
===================================================== -->

<div class="ai-cursor">

    <div class="cursor-core"></div>

    <div class="cursor-ring"></div>

    <div class="cursor-glow"></div>

</div>


<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>
<div class="cursor-trail"></div>



<!-- =====================================================
     APP
===================================================== -->

<div class="app">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-top">


            <!-- LOGO -->

            <div class="brand">

                <div class="brand-logo">

                    <span>✦</span>

                </div>

                <div class="brand-name">

                    Mini <span>AI</span>

                </div>

            </div>



            <!-- NEW CHAT -->

            <button
                class="new-chat-btn"
                id="newChatBtn"
                type="button"
            >

                <span class="plus-icon">
                    +
                </span>

                <span>
                    New Chat
                </span>

            </button>



            <!-- TODAY -->

            <div class="sidebar-section">

                <div class="section-title">
                    TODAY
                </div>


                <button
                    class="conversation active"
                    type="button"
                    id="currentConversation"
                >

                    <span class="conversation-icon">
                        ◇
                    </span>

                    <span>
                        New conversation
                    </span>

                </button>

            </div>



            <!-- RECENT -->

            <div
                class="sidebar-section recent-section"
            >

                <div class="section-title">
                    RECENT
                </div>

                <div id="recentChats"></div>

            </div>

        </div>



        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button
                class="sidebar-bottom-btn"
                id="settingsBtn"
                type="button"
            >

                <span>
                    ⚙
                </span>

                <span>
                    Settings
                </span>

                <span class="arrow">
                    ›
                </span>

            </button>

        </div>

    </aside>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="topbar">


            <div class="topbar-left">

                <button
                    class="mobile-menu-btn"
                    id="mobileMenuBtn"
                    type="button"
                >

                    ☰

                </button>

            </div>



            <div class="topbar-actions">

                <div class="ai-orb-small">

                    <div class="ai-logo">

                        <div class="ai-orbit orbit-1"></div>

                        <div class="ai-orbit orbit-2"></div>

                        <div class="ai-orbit orbit-3"></div>

                        <div class="ai-glow"></div>


                        <div class="ai-core">

                            <span>
                                AI
                            </span>

                        </div>


                        <div class="ai-particle p1"></div>

                        <div class="ai-particle p2"></div>

                        <div class="ai-particle p3"></div>

                        <div class="ai-particle p4"></div>

                    </div>

                </div>

            </div>

        </header>



        <!-- =================================================
             CHAT AREA
        ================================================== -->

        <section class="chat-area">


            <!-- =================================================
                 WELCOME SCREEN
            ================================================== -->

            <div
                class="welcome-screen"
                id="welcomeScreen"
            >


                <!-- MANI AI LOGO -->

                <div class="mani-ai-logo">

                    <div class="mani-ai-ring ring-one"></div>

                    <div class="mani-ai-ring ring-two"></div>


                    <div class="mani-ai-text">

                        <span class="mani-main">
                            MANI
                        </span>

                        <span class="mani-ai">
                            AI
                        </span>

                    </div>


                    <div class="mani-ai-line"></div>


                    <div class="mani-particle particle-one"></div>

                    <div class="mani-particle particle-two"></div>

                    <div class="mani-particle particle-three"></div>

                    <div class="mani-particle particle-four"></div>

                </div>



                <!-- =================================================
                     QUICK CARDS
                ================================================== -->

                <div class="quick-cards">


                    <button
                        class="quick-card"
                        data-prompt="Give me some creative ideas for my next project"
                        type="button"
                    >

                        <div class="card-icon idea">
                            ♧
                        </div>

                        <strong>
                            Get Ideas
                        </strong>

                        <span>
                            Brainstorm anything
                        </span>

                    </button>



                    <button
                        class="quick-card"
                        data-prompt="Help me write professional content"
                        type="button"
                    >

                        <div class="card-icon write">
                            ◈
                        </div>

                        <strong>
                            Write Content
                        </strong>

                        <span>
                            Blogs, emails, scripts
                        </span>

                    </button>



                    <button
                        class="quick-card"
                        data-prompt="Help me debug and solve this coding problem"
                        type="button"
                    >

                        <div class="card-icon code">
                            &lt;/&gt;
                        </div>

                        <strong>
                            Code Help
                        </strong>

                        <span>
                            Debug, explain, solve
                        </span>

                    </button>



                    <button
                        class="quick-card"
                        data-prompt="Analyze this data and give me useful insights"
                        type="button"
                    >

                        <div class="card-icon data">
                            ▥
                        </div>

                        <strong>
                            Analyze Data
                        </strong>

                        <span>
                            Charts, insights, trends
                        </span>

                    </button>



                    <button
                        class="quick-card"
                        data-prompt="Help me create a modern UI design"
                        type="button"
                    >

                        <div class="card-icon design">
                            ✿
                        </div>

                        <strong>
                            Design & UI
                        </strong>

                        <span>
                            Layouts, UI ideas
                        </span>

                    </button>

                </div>

            </div>



            <!-- =================================================
                 CHAT MESSAGES
            ================================================== -->

            <div
                class="chat-messages"
                id="chatMessages"
            ></div>



            <!-- =================================================
                 PSD TO HTML PREVIEW CONTAINER

                 This stays inside chat area and will NOT
                 take the entire screen.
            ================================================== -->

            <div
                class="psd-result"
                id="psdResult"
                hidden
            >

                <div class="psd-result-header">

                    <div>

                        <strong>
                            PSD To HTML
                        </strong>

                        <span>
                            Generated website preview
                        </span>

                    </div>


                    <button
                        type="button"
                        id="closePsdPreview"
                        class="psd-close-btn"
                        title="Close preview"
                    >
                        ×
                    </button>

                </div>



                <!-- STATUS -->

                <div
                    class="psd-status"
                    id="psdStatus"
                >
                    Ready
                </div>



                <!-- PREVIEW -->

                <div class="psd-preview-wrapper">

                    <iframe
                        id="psdPreview"
                        class="psd-preview"
                        title="PSD HTML Preview"
                        loading="lazy"
                    ></iframe>

                </div>



                <!-- DOWNLOAD -->

                <div class="psd-actions">

                    <button
                        type="button"
                        id="downloadHtmlBtn"
                        class="psd-download-btn"
                    >
                        ↓ Download HTML
                    </button>

                </div>

            </div>

        </section>



        <!-- =================================================
             COMPOSER AREA
        ================================================== -->

        <div class="composer-area">


            <!-- =================================================
                 IMAGE ATTACHMENT PREVIEW
            ================================================== -->

            <div
                class="attachment-preview"
                id="attachmentPreview"
            ></div>



            <!-- =================================================
                 COMPOSER
            ================================================== -->

            <div
                class="composer"
                id="composer"
            >


                <!-- INPUT -->

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="Message Mini AI..."
                    autocomplete="off"
                ></textarea>



                <!-- EXPAND -->

                <button
                    type="button"
                    class="composer-expand"
                    id="composerExpand"
                    title="Expand"
                >
                    +
                </button>



                <!-- =================================================
                     TOOLBAR
                ================================================== -->

                <div class="composer-toolbar">


                    <div class="composer-left">


                        <!-- PLUS -->

                        <button
                            type="button"
                            class="tool-btn"
                            id="plusBtn"
                            title="Tools"
                        >
                            +
                        </button>



                        <!-- WEB -->

                        <button
                            type="button"
                            class="tool-btn"
                            id="webBtn"
                            title="Web search"
                        >

                            <span class="globe"></span>

                        </button>



                        <!-- IMAGE ATTACH -->

                        <button
                            type="button"
                            class="tool-btn"
                            id="attachBtn"
                            title="Attach images"
                        >

                            <span class="paperclip">
                                ⌕
                            </span>

                        </button>



                        <!-- IMAGE FILE INPUT -->

                        <input
                            type="file"
                            id="fileInput"
                            hidden
                            multiple
                            accept="image/*"
                        >



                        <!-- MAGIC -->

                        <button
                            type="button"
                            class="tool-btn magic-btn"
                            id="magicBtn"
                            title="AI tools"
                        >
                            ✣
                        </button>

                    </div>



                    <div class="composer-right">


                        <!-- MIC -->

                        <button
                            type="button"
                            class="tool-btn mic-btn"
                            id="micBtn"
                            title="Voice input"
                        >
                            ♫
                        </button>



                        <!-- SEND -->

                        <button
                            type="button"
                            class="send-btn"
                            id="sendBtn"
                            title="Send"
                        >
                            ↑
                        </button>

                    </div>

                </div>



                <!-- =================================================
                     TOOLS POPUP
                ================================================== -->

                <div
                    class="tools-popup"
                    id="toolsPopup"
                >


                    <!-- GENERATE IMAGE -->

                    <button
                        type="button"
                        class="tool-option"
                        data-action="image"
                    >

                        <span>
                            ✦
                        </span>

                        <div>

                            <strong>
                                Generate Image
                            </strong>

                            <small>
                                Create an image with AI
                            </small>

                        </div>

                    </button>



                    <!-- CODE -->

                    <button
                        type="button"
                        class="tool-option"
                        data-action="code"
                    >

                        <span>
                            &lt;/&gt;
                        </span>

                        <div>

                            <strong>
                                Code
                            </strong>

                            <small>
                                Write or debug code
                            </small>

                        </div>

                    </button>



                    <!-- SUMMARIZE -->

                    <button
                        type="button"
                        class="tool-option"
                        data-action="summarize"
                    >

                        <span>
                            ≡
                        </span>

                        <div>

                            <strong>
                                Summarize
                            </strong>

                            <small>
                                Summarize text
                            </small>

                        </div>

                    </button>

                </div>

            </div>



            <!-- =================================================
                 DISCLAIMER
            ================================================== -->

            <div class="composer-disclaimer">

                Mini AI can make mistakes.
                Check important information.

            </div>

        </div>

    </main>

</div>



<!-- =====================================================
     MOBILE OVERLAY
===================================================== -->

<div
    class="mobile-overlay"
    id="mobileOverlay"
></div>



<!-- =====================================================
     SCRIPT
===================================================== -->

<script src="script.js"></script>


<!-- =====================================================
     PSD PREVIEW CONTROL
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const psdResult =
            document.getElementById(
                "psdResult"
            );

        const closePsdPreview =
            document.getElementById(
                "closePsdPreview"
            );

        const psdPreview =
            document.getElementById(
                "psdPreview"
            );

        const downloadHtmlBtn =
            document.getElementById(
                "downloadHtmlBtn"
            );



        /* =========================================
           CLOSE PREVIEW
        ========================================= */

        if (closePsdPreview) {

            closePsdPreview.addEventListener(
                "click",
                () => {

                    psdResult.hidden = true;

                    psdPreview.src = "";

                }
            );

        }



        /* =========================================
           DOWNLOAD GENERATED HTML
        ========================================= */

        if (downloadHtmlBtn) {

            downloadHtmlBtn.addEventListener(
                "click",
                () => {

                    const html =
                        psdPreview.contentDocument
                            ?.documentElement
                            ?.outerHTML;

                    if (!html) {

                        alert(
                            "HTML preview is not ready yet."
                        );

                        return;

                    }


                    const blob =
                        new Blob(
                            [
                                "<!DOCTYPE html>\n" +
                                html
                            ],
                            {
                                type:
                                    "text/html"
                            }
                        );


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        url;

                    link.download =
                        "generated-website.html";


                    document.body.appendChild(
                        link
                    );

                    link.click();

                    link.remove();


                    URL.revokeObjectURL(
                        url
                    );

                }
            );

        }

    }
);

</script>


</body>

</html>
