<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Mini AI - Your smart AI assistant"
    >

    <meta
        name="theme-color"
        content="#030617"
    >

    <title>Mini AI</title>

    <!-- IMPORTANT:
         style.css must be in the same folder as this HTML file.
    -->
    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <!-- =====================================================
         PREMIUM AI CURSOR
    ====================================================== -->

    <div
        class="ai-cursor"
        aria-hidden="true"
    >
        <div class="cursor-core"></div>
        <div class="cursor-ring"></div>
        <div class="cursor-glow"></div>
    </div>

    <div
        class="cursor-trail"
        aria-hidden="true"
    ></div>

    <div
        class="cursor-trail"
        aria-hidden="true"
    ></div>

    <div
        class="cursor-trail"
        aria-hidden="true"
    ></div>

    <div
        class="cursor-trail"
        aria-hidden="true"
    ></div>

    <div
        class="cursor-trail"
        aria-hidden="true"
    ></div>

    <div
        class="cursor-trail"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         APP
    ====================================================== -->

    <div class="app">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-top">


                <!-- BRAND -->

                <div class="brand">

                    <div class="brand-logo">
                        <span>✦</span>
                    </div>

                    <div class="brand-name">
                        Mini <span>AI</span>
                    </div>

                </div>


                <!-- NEW CHAT -->

                <button
                    class="new-chat-btn"
                    id="newChatBtn"
                    type="button"
                    aria-label="Start a new chat"
                >

                    <span class="plus-icon">
                        +
                    </span>

                    <span>
                        New Chat
                    </span>

                </button>


                <!-- TODAY -->

                <div class="sidebar-section">

                    <div class="section-title">
                        TODAY
                    </div>

                    <button
                        class="conversation active"
                        id="currentConversation"
                        type="button"
                    >

                        <span class="conversation-icon">
                            ◇
                        </span>

                        <span>
                            New conversation
                        </span>

                    </button>

                </div>


                <!-- RECENT -->

                <div class="sidebar-section recent-section">

                    <div class="section-title">
                        RECENT
                    </div>

                    <div id="recentChats"></div>

                </div>

            </div>


            <!-- SIDEBAR BOTTOM -->

            <div class="sidebar-bottom">

                <button
                    class="sidebar-bottom-btn"
                    id="settingsBtn"
                    type="button"
                >

                    <span>
                        ⚙
                    </span>

                    <span>
                        Settings
                    </span>

                    <span class="arrow">
                        ›
                    </span>

                </button>

            </div>

        </aside>


        <!-- =================================================
             MAIN
        ================================================== -->

        <main class="main">


            <!-- =================================================
                 TOP BAR
            ================================================== -->

            <header class="topbar">

                <div class="topbar-left">

                    <button
                        class="mobile-menu-btn"
                        id="mobileMenuBtn"
                        type="button"
                        aria-label="Open menu"
                    >
                        ☰
                    </button>

                </div>


                <div class="topbar-actions">

                    <!-- AI LOGO -->

                    <div class="ai-orb-small">

                        <div class="ai-logo">

                            <div
                                class="ai-orbit orbit-1"
                                aria-hidden="true"
                            ></div>

                            <div
                                class="ai-orbit orbit-2"
                                aria-hidden="true"
                            ></div>

                            <div
                                class="ai-orbit orbit-3"
                                aria-hidden="true"
                            ></div>

                            <div
                                class="ai-glow"
                                aria-hidden="true"
                            ></div>

                            <div class="ai-core">
                                <span>AI</span>
                            </div>

                            <div
                                class="ai-particle p1"
                                aria-hidden="true"
                            ></div>

                            <div
                                class="ai-particle p2"
                                aria-hidden="true"
                            ></div>

                            <div
                                class="ai-particle p3"
                                aria-hidden="true"
                            ></div>

                            <div
                                class="ai-particle p4"
                                aria-hidden="true"
                            ></div>

                        </div>

                    </div>

                </div>

            </header>


            <!-- =================================================
                 CHAT AREA
            ================================================== -->

            <section class="chat-area">


                <!-- =================================================
                     WELCOME SCREEN
                ================================================== -->

                <div
                    class="welcome-screen"
                    id="welcomeScreen"
                >


                    <!-- MANI AI LOGO -->

                    <div class="mani-ai-logo">

                        <div
                            class="mani-ai-ring ring-one"
                            aria-hidden="true"
                        ></div>

                        <div
                            class="mani-ai-ring ring-two"
                            aria-hidden="true"
                        ></div>


                        <div class="mani-ai-text">

                            <span class="mani-main">
                                MANI
                            </span>

                            <span class="mani-ai">
                                AI
                            </span>

                        </div>


                        <div
                            class="mani-ai-line"
                            aria-hidden="true"
                        ></div>


                        <div
                            class="mani-particle particle-one"
                            aria-hidden="true"
                        ></div>

                        <div
                            class="mani-particle particle-two"
                            aria-hidden="true"
                        ></div>

                        <div
                            class="mani-particle particle-three"
                            aria-hidden="true"
                        ></div>

                        <div
                            class="mani-particle particle-four"
                            aria-hidden="true"
                        ></div>

                    </div>


                    <!-- QUICK CARDS -->

                    <div class="quick-cards">


                        <!-- GET IDEAS -->

                        <button
                            class="quick-card"
                            type="button"
                            data-prompt="Give me some creative ideas for my next project"
                        >

                            <div class="card-icon idea">
                                ♧
                            </div>

                            <strong>
                                Get Ideas
                            </strong>

                            <span>
                                Brainstorm anything
                            </span>

                        </button>


                        <!-- WRITE CONTENT -->

                        <button
                            class="quick-card"
                            type="button"
                            data-prompt="Help me write professional content"
                        >

                            <div class="card-icon write">
                                ◈
                            </div>

                            <strong>
                                Write Content
                            </strong>

                            <span>
                                Blogs, emails, scripts
                            </span>

                        </button>


                        <!-- CODE HELP -->

                        <button
                            class="quick-card"
                            type="button"
                            data-prompt="Help me debug and solve this coding problem"
                        >

                            <div class="card-icon code">
                                &lt;/&gt;
                            </div>

                            <strong>
                                Code Help
                            </strong>

                            <span>
                                Debug, explain, solve
                            </span>

                        </button>


                        <!-- ANALYZE DATA -->

                        <button
                            class="quick-card"
                            type="button"
                            data-prompt="Analyze this data and give me useful insights"
                        >

                            <div class="card-icon data">
                                ▥
                            </div>

                            <strong>
                                Analyze Data
                            </strong>

                            <span>
                                Charts, insights, trends
                            </span>

                        </button>


                        <!-- DESIGN -->

                        <button
                            class="quick-card"
                            type="button"
                            data-prompt="Help me create a modern UI design"
                        >

                            <div class="card-icon design">
                                ✿
                            </div>

                            <strong>
                                Design &amp; UI
                            </strong>

                            <span>
                                Layouts, UI ideas
                            </span>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     CHAT MESSAGES
                ================================================== -->

                <div
                    class="chat-messages"
                    id="chatMessages"
                ></div>

            </section>


            <!-- =================================================
                 COMPOSER AREA
            ================================================== -->

            <div class="composer-area">


                <!-- ATTACHMENT PREVIEW -->

                <div
                    class="attachment-preview"
                    id="attachmentPreview"
                ></div>


                <!-- COMPOSER -->

                <div
                    class="composer"
                    id="composer"
                >


                    <!-- MESSAGE INPUT -->

                    <textarea
                        id="messageInput"
                        class="message-input"
                        rows="1"
                        placeholder="Message Mini AI..."
                        autocomplete="off"
                        spellcheck="true"
                        aria-label="Message Mini AI"
                    ></textarea>


                    <!-- EXPAND -->

                    <button
                        type="button"
                        class="composer-expand"
                        id="composerExpand"
                        title="Expand composer"
                        aria-label="Expand composer"
                    >
                        +
                    </button>


                    <!-- TOOLBAR -->

                    <div class="composer-toolbar">


                        <!-- LEFT TOOLS -->

                        <div class="composer-left">


                            <!-- PLUS / TOOLS -->

                            <button
                                type="button"
                                class="tool-btn"
                                id="plusBtn"
                                title="Tools"
                                aria-label="Open tools"
                                aria-expanded="false"
                            >
                                +
                            </button>


                            <!-- WEB SEARCH -->

                            <button
                                type="button"
                                class="tool-btn"
                                id="webBtn"
                                title="Web search"
                                aria-label="Toggle web search"
                                aria-pressed="false"
                            >

                                <span class="globe">
                                    ◉
                                </span>

                            </button>


                            <!-- ATTACH IMAGE -->

                            <button
                                type="button"
                                class="tool-btn"
                                id="attachBtn"
                                title="Attach images"
                                aria-label="Attach images"
                            >

                                <span class="paperclip">
                                    ⌕
                                </span>

                            </button>


                            <!-- FILE INPUT -->

                            <input
                                type="file"
                                id="fileInput"
                                hidden
                                multiple
                                accept="image/*"
                            >


                            <!-- MAGIC AI -->

                            <button
                                type="button"
                                class="tool-btn magic-btn"
                                id="magicBtn"
                                title="AI tools"
                                aria-label="Magic AI"
                            >
                                ✣
                            </button>

                        </div>


                        <!-- RIGHT TOOLS -->

                        <div class="composer-right">


                            <!-- MICROPHONE -->

                            <button
                                type="button"
                                class="tool-btn mic-btn"
                                id="micBtn"
                                title="Voice input"
                                aria-label="Voice input"
                            >
                                ♫
                            </button>


                            <!-- SEND -->

                            <button
                                type="button"
                                class="send-btn"
                                id="sendBtn"
                                title="Send message"
                                aria-label="Send message"
                            >
                                ↑
                            </button>

                        </div>

                    </div>


                    <!-- =================================================
                         TOOLS POPUP
                    ================================================== -->

                    <div
                        class="tools-popup"
                        id="toolsPopup"
                        role="menu"
                    >


                        <!-- GENERATE IMAGE -->

                        <button
                            type="button"
                            class="tool-option"
                            data-action="image"
                            role="menuitem"
                        >

                            <span>
                                ✦
                            </span>

                            <div>

                                <strong>
                                    Generate Image
                                </strong>

                                <small>
                                    Create an image with AI
                                </small>

                            </div>

                        </button>


                        <!-- CODE -->

                        <button
                            type="button"
                            class="tool-option"
                            data-action="code"
                            role="menuitem"
                        >

                            <span>
                                &lt;/&gt;
                            </span>

                            <div>

                                <strong>
                                    Code
                                </strong>

                                <small>
                                    Write or debug code
                                </small>

                            </div>

                        </button>


                        <!-- SUMMARIZE -->

                        <button
                            type="button"
                            class="tool-option"
                            data-action="summarize"
                            role="menuitem"
                        >

                            <span>
                                ≡
                            </span>

                            <div>

                                <strong>
                                    Summarize
                                </strong>

                                <small>
                                    Summarize text
                                </small>

                            </div>

                        </button>

                    </div>

                </div>


                <!-- DISCLAIMER -->

                <div class="composer-disclaimer">
                    Mini AI can make mistakes. Check important information.
                </div>

            </div>

        </main>

    </div>


    <!-- =====================================================
         MOBILE OVERLAY
    ====================================================== -->

    <div
        class="mobile-overlay"
        id="mobileOverlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- IMPORTANT:
         script.js must be in the same folder as this HTML file.
    -->

    <script src="./script.js"></script>

</body>

</html>
