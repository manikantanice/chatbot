<!-- CHAT AREA -->
<main class="chat-area">

    <div class="chat-messages" id="chatMessages">
        <!-- Messages will appear here -->
    </div>

    <!-- AI COMPOSER -->
    <div class="composer-wrapper">

        <!-- Attachment Preview -->
        <div class="attachment-preview" id="attachmentPreview"></div>

        <div class="composer" id="composer">

            <!-- Textarea -->
            <textarea
                id="messageInput"
                class="message-input"
                rows="1"
                placeholder="Message Mini AI..."
                autocomplete="off"
            ></textarea>

            <!-- Top right button -->
            <button
                type="button"
                class="composer-expand"
                id="composerExpand"
                title="More options"
            >
                +
            </button>

            <!-- Bottom toolbar -->
            <div class="composer-toolbar">

                <div class="composer-left">

                    <!-- PLUS -->
                    <button
                        type="button"
                        class="tool-btn"
                        id="plusBtn"
                        title="Tools"
                    >
                        +
                    </button>

                    <!-- WEB -->
                    <button
                        type="button"
                        class="tool-btn"
                        id="webBtn"
                        title="Web search"
                    >
                        <span class="globe-icon">●</span>
                    </button>

                    <!-- FILE -->
                    <button
                        type="button"
                        class="tool-btn"
                        id="attachBtn"
                        title="Attach file"
                    >
                        📎
                    </button>

                    <input
                        type="file"
                        id="fileInput"
                        hidden
                        multiple
                    >

                    <!-- AI -->
                    <button
                        type="button"
                        class="tool-btn magic-btn"
                        id="magicBtn"
                        title="AI tools"
                    >
                        ✨
                    </button>

                </div>

                <div class="composer-right">

                    <!-- VOICE -->
                    <button
                        type="button"
                        class="tool-btn mic-btn"
                        id="micBtn"
                        title="Voice input"
                    >
                        🎙
                    </button>

                    <!-- SEND -->
                    <button
                        type="button"
                        class="send-btn"
                        id="sendBtn"
                        title="Send"
                    >
                        ↑
                    </button>

                </div>

            </div>

            <!-- Tools Popup -->
            <div class="tools-popup" id="toolsPopup">

                <button class="tool-option" data-action="image">
                    <span>🖼️</span>
                    <div>
                        <strong>Generate Image</strong>
                        <small>Create an image with AI</small>
                    </div>
                </button>

                <button class="tool-option" data-action="code">
                    <span>💻</span>
                    <div>
                        <strong>Code</strong>
                        <small>Write or debug code</small>
                    </div>
                </button>

                <button class="tool-option" data-action="summarize">
                    <span>📝</span>
                    <div>
                        <strong>Summarize</strong>
                        <small>Summarize text</small>
                    </div>
                </button>

            </div>

        </div>

        <div class="composer-disclaimer">
            Mini AI can make mistakes. Check important information.
        </div>

    </div>

</main>
